<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<nav class="navbar navbar-expand-lg bg-aqua custom-navbar position-relative" role="navigation" aria-label="Main Navigation">
  <div class="container px-4 px-lg-5">

    <!-- Logo / Inicio -->
    <a class="navbar-brand" routerLink="/inicio" style="color: white;" [attr.aria-label]="'Ir a Inicio'">
      <i class="bi bi-house-door-fill me-1"></i> Inicio
    </a>

    <!-- Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
            aria-controls="navbarContent" aria-expanded="false" aria-label="Alternar navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido del Navbar -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">

        <!-- Perfil -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/miperfil" routerLinkActive="active" style="color: white;"
             [attr.aria-label]="'Ir a Mi Perfil'">
            <i class="bi bi-person-fill me-1"></i> Mi perfil
          </a>
        </li>

        <!-- Mascotas (dropdown) -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
             data-bs-toggle="dropdown" [attr.aria-expanded]="false"
             [attr.aria-label]="'Menú Mis Mascotas'">
            Mis Mascotas
          </a>

          <ul class="dropdown-menu" [attr.aria-labelledby]="'navbarDropdown'">
            <li *ngFor="let mascota of mascotas">
              <a class="dropdown-item" [routerLink]="'/perfilmascota/' + mascota.idmascota"
                 [attr.aria-label]="'Ver perfil de ' + mascota.nombre">
                {{ mascota.nombre }}
              </a>
            </li>
            @if (mascotas.length === 0) {
              <li>
                <a class="dropdown-item" [routerLink]="'/inicio'" [attr.aria-label]="'Añadir mascotas en inicio'">
                  ¡Añade tus mascotas en inicio!
                </a>
              </li>
            }
          </ul>
        </li>

        <!-- Pacientes solo si tipo 2 -->
        @if (tipo === "2") {
          <li class="nav-item">
            <a class="nav-link" routerLink="/pacientes" routerLinkActive="active" style="color: white;"
               [attr.aria-label]="'Ir a Pacientes'">
              <i class="bi bi-clipboard2-pulse me-1"></i> Pacientes
            </a>
          </li>
        }
      </ul>

      <!-- Botón Cerrar sesión -->
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-logout" (click)="cerrarSesion()" routerLinkActive="active"
           [attr.aria-label]="'Cerrar sesión'">
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
        </a>
        <div class="navbar-huellas" aria-hidden="true">🐾</div>
      </div>

    </div>
  </div>
</nav>
